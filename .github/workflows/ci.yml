name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      # Tauri embeds dist/ at compile time, so the Rust steps need it.
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: ''
          - os: macos-14
            platform: macos
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      # Tauri embeds dist/ at compile time, so the Rust steps need it.
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install tauri-cli --version "^2" --locked

      - name: Build and inspect Windows NSIS bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo tauri build --config src-tauri/tauri.bundle.conf.json --bundles nsis
          Get-ChildItem target/release/bundle/nsis/*.exe | Format-Table Name, @{Name='SizeMB';Expression={[math]::Round($_.Length / 1MB, 2)}}
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } | Select-Object -First 1 -ExpandProperty FullName
          if ($dumpbin) {
            & $dumpbin /dependents target/release/duragon.exe
            & $dumpbin /dependents target/release/duragon-voice.exe
          }

      - name: Build and inspect macOS Apple Silicon DMG bundle
        if: matrix.platform == 'macos'
        run: |
          cargo tauri build --config src-tauri/tauri.bundle.conf.json --target aarch64-apple-darwin --bundles dmg
          ls -lh target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          for bin in target/aarch64-apple-darwin/release/bundle/macos/Duragon.app/Contents/MacOS/*; do
            echo "=== $bin ==="
            otool -L "$bin"
          done
