name: Release Bundles (Linux, Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux & Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            flatpak \
            flatpak-builder

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build AppImage and deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx --yes @tauri-apps/cli@2 build --config src-tauri/tauri.bundle.conf.json --bundles appimage,deb

      - name: Build Flatpak single-file bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
          flatpak-builder --user --force-clean --repo=flatpak-repo build-flatpak packaging/flatpak/dev.duragon.app.yml
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          flatpak build-bundle flatpak-repo "Duragon-${TAG}-x86_64.flatpak" dev.duragon.app

      - name: Stage Linux bundles
        run: |
          mkdir -p dist-bundles
          cp target/release/bundle/appimage/*.AppImage dist-bundles/
          cp target/release/bundle/deb/*.deb dist-bundles/
          cp Duragon-*-x86_64.flatpak dist-bundles/
          ls -lh dist-bundles

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: dist-bundles/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build NSIS installer
        run: npx --yes @tauri-apps/cli@2 build --config src-tauri/tauri.bundle.conf.json --bundles nsis

      - name: Inspect and stage Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-bundles | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist-bundles/
          Get-ChildItem dist-bundles | Format-Table Name, @{Name='SizeMB';Expression={[math]::Round($_.Length / 1MB, 2)}}
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } | Select-Object -First 1 -ExpandProperty FullName
          if ($dumpbin) {
            & $dumpbin /dependents target/release/duragon.exe
            & $dumpbin /dependents target/release/duragon-voice.exe
          }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: dist-bundles/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build Apple Silicon DMG
        run: npx --yes @tauri-apps/cli@2 build --config src-tauri/tauri.bundle.conf.json --target aarch64-apple-darwin --bundles dmg

      - name: Inspect and stage macOS bundle
        run: |
          mkdir -p dist-bundles
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-bundles/
          ls -lh dist-bundles
          for bin in target/aarch64-apple-darwin/release/duragon target/aarch64-apple-darwin/release/duragon-voice; do
            echo "=== $bin ==="
            otool -L "$bin"
          done

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundles-macos
          path: dist-bundles/*
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: ls -lh release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Duragon ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
