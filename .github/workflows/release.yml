name: Release Bundles (Linux, Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux & Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            flatpak \
            flatpak-builder

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build AppImage and deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo tauri build --config src-tauri/tauri.bundle.conf.json --bundles appimage,deb

      - name: Build Flatpak single-file bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
          flatpak-builder --user --force-clean --repo=flatpak-repo build-flatpak packaging/flatpak/dev.duragon.app.yml
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          flatpak build-bundle flatpak-repo "Duragon-${TAG}-x86_64.flatpak" dev.duragon.app

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            Duragon-*-x86_64.flatpak
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build NSIS installer
        run: cargo tauri build --config src-tauri/tauri.bundle.conf.json --bundles nsis

      - name: Inspect Windows bundle
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | Format-Table Name, @{Name='SizeMB';Expression={[math]::Round($_.Length / 1MB, 2)}}
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } | Select-Object -First 1 -ExpandProperty FullName
          if ($dumpbin) {
            & $dumpbin /dependents target/release/duragon.exe
            & $dumpbin /dependents target/release/duragon-voice.exe
          }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Apple Silicon DMG
        run: cargo tauri build --config src-tauri/tauri.bundle.conf.json --target aarch64-apple-darwin --bundles dmg

      - name: Inspect macOS bundle
        run: |
          ls -lh target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          for bin in target/aarch64-apple-darwin/release/bundle/macos/Duragon.app/Contents/MacOS/*; do
            echo "=== $bin ==="
            otool -L "$bin"
          done

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundles-macos
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Duragon ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
