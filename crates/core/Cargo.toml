[package]
name = "duragon-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "duragon_core"

[dependencies]
anyhow = "1"
docx-rs = "0.4"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "rt", "rt-multi-thread", "macros", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
